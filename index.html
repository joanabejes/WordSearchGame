<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AquaSearch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- clean ocean (start screen) -->
<div id="ocean-scene">
    <div id="ocean-bubbles"></div>
    <div id="ocean-creatures">
        <img class="creature swim"  src="img/sea/fish1.svg"     style="--x:6%;  --y:20%; --s:1.0; --d:0s;   --t:16s;" alt="">
        <img class="creature swim"  src="img/sea/fish3.svg"     style="--x:74%; --y:12%; --s:0.9; --d:2s;   --t:19s;" alt="">
        <img class="creature swim"  src="img/sea/fish5.svg"     style="--x:28%; --y:64%; --s:1.2; --d:4s;   --t:17s;" alt="">
        <img class="creature swim"  src="img/sea/fish7.svg"     style="--x:86%; --y:52%; --s:1.0; --d:1s;   --t:21s;" alt="">
        <img class="creature swim"  src="img/sea/fish2.svg"     style="--x:48%; --y:78%; --s:0.8; --d:3s;   --t:23s;" alt="">
        <img class="creature big"   src="img/sea/shark.svg"     style="--x:52%; --y:32%; --s:1.7; --d:3s;   --t:28s;" alt="">
        <img class="creature big"   src="img/sea/octopus.svg"   style="--x:12%; --y:46%; --s:1.4; --d:5s;   --t:24s;" alt="">
        <img class="creature big"   src="img/sea/dolphin.svg"   style="--x:78%; --y:74%; --s:1.3; --d:2.5s; --t:26s;" alt="">
        <img class="creature big"   src="img/sea/whale.svg"     style="--x:36%; --y:8%;  --s:1.5; --d:6s;   --t:32s;" alt="">
        <img class="creature big"   src="img/sea/jellyfish.svg" style="--x:64%; --y:58%; --s:1.1; --d:1.5s; --t:20s;" alt="">
        <img class="creature still" src="img/sea/starfish.svg"  style="--x:8%;  --y:86%; --s:1.0; --d:0.5s;" alt="">
        <img class="creature still" src="img/sea/crab.svg"      style="--x:90%; --y:88%; --s:1.0; --d:1.2s;" alt="">
        <img class="creature still" src="img/sea/lobster.svg"   style="--x:70%; --y:92%; --s:0.9; --d:2s;"   alt="">
        <img class="creature still" src="img/sea/coral1.svg"    style="--x:2%;  --y:78%; --s:1.3; --d:0s;"   alt="">
        <img class="creature still" src="img/sea/coral3.svg"    style="--x:20%; --y:90%; --s:1.1; --d:0.8s;" alt="">
        <img class="creature still" src="img/sea/coral5.svg"    style="--x:52%; --y:94%; --s:1.2; --d:1.6s;" alt="">
        <img class="creature still" src="img/sea/coral2.svg"    style="--x:82%; --y:80%; --s:1.0; --d:2.4s;" alt="">
    </div>



    <div id="ocean-content">
        <svg id="logo" viewBox="0 0 980 280" role="img" aria-label="AquaSearch">
            <defs>
                <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%"   stop-color="#e1f5fe"/>
                    <stop offset="45%"  stop-color="#4fc3f7"/>
                    <stop offset="100%" stop-color="#01579b"/>
                </linearGradient>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="6" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            <text x="490" y="160" text-anchor="middle"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="104" font-weight="bold"
                  fill="url(#waterGrad)" filter="url(#glow)"
                  letter-spacing="3">AquaSearch</text>
            <path id="wave" d="M100 215 Q 250 190 400 215 T 700 215 T 900 215"
                  stroke="#4fc3f7" stroke-width="7" fill="none"
                  stroke-linecap="round" opacity="0.85"/>
        </svg>

        <p id="tagline">Save the ocean</p>
        <button id="play-button">Play</button>
    </div>
</div>

<!-- ocean background -->
<div id="ocean-layer">
    <div id="ocean-clean"></div>
    <div id="ocean-polluted"></div>

    <div id="ocean-bg-creatures">
        <img class="bg-creature swim"   src="img/sea/fish2.svg"   style="--x:10%; --y:30%; --s:1.0; --d:0s;   --t:22s;" alt="">
        <img class="bg-creature swim"   src="img/sea/fish4.svg"   style="--x:80%; --y:24%; --s:0.9; --d:3s;   --t:26s;" alt="">
        <img class="bg-creature swim"   src="img/sea/fish6.svg"   style="--x:34%; --y:72%; --s:1.1; --d:5s; --t:24s;" alt="">
        <img class="bg-creature big"   src="img/sea/whale.svg"     style="--x:60%; --y:14%;  --s:1.4; --d:2s;   --t:34s;" alt="">
        <img class="bg-creature big"   src="img/sea/jellyfish.svg" style="--x:14%; --y:60%; --s:1.2; --d:4s; --t:20s;" alt="">
        <img class="bg-creature still" src="img/sea/starfish.svg"  style="--x:4%;  --y:84%; --s:1.2; --d:0.6s;" alt="">
        <img class="bg-creature still" src="img/sea/crab.svg"      style="--x:88%; --y:86%; --s:1.1; --d:1.4s;" alt="">
        <img class="bg-creature still" src="img/sea/lobster.svg"   style="--x:46%; --y:92%; --s:0.9; --d:2s;"   alt="">
    </div>

    <div id="ocean-trash">

        <img class="trash-item" src="img/trash/bottle.svg"  style="--x:12%; --y:18%; --s:1.0;  --r:-12deg;" alt="">
        <img class="trash-item" src="img/trash/bag.svg"     style="--x:78%; --y:14%; --s:1.1;  --r:8deg;"   alt="">
        <img class="trash-item" src="img/trash/straw.svg"   style="--x:44%; --y:10%; --s:0.7;  --r:34deg;"  alt="">
        <img class="trash-item" src="img/trash/can.svg"     style="--x:92%; --y:26%; --s:0.8;  --r:16deg;"  alt="">

        <img class="trash-item" src="img/trash/tire.svg"    style="--x:62%; --y:40%; --s:1.0;  --r:0deg;"   alt="">
        <img class="trash-item" src="img/trash/bottle.svg"  style="--x:6%;  --y:44%; --s:0.8;  --r:22deg;"  alt="">
        <img class="trash-item" src="img/trash/straw.svg"   style="--x:86%; --y:48%; --s:0.8;  --r:-28deg;" alt="">
        <img class="trash-item" src="img/trash/bag.svg"     style="--x:48%; --y:52%; --s:0.9;  --r:-14deg;" alt="">


        <img class="trash-item" src="img/trash/can.svg"     style="--x:20%; --y:66%; --s:0.9;  --r:-20deg;" alt="">
        <img class="trash-item" src="img/trash/tire.svg"    style="--x:74%; --y:70%; --s:1.1;  --r:0deg;"   alt="">
        <img class="trash-item" src="img/trash/oil.svg"     style="--x:38%; --y:78%; --s:1.2;  --r:0deg;"   alt="">
        <img class="trash-item" src="img/trash/bottle.svg"  style="--x:88%; --y:84%; --s:0.9;  --r:-8deg;"  alt="">
        <img class="trash-item" src="img/trash/oil.svg"     style="--x:10%; --y:88%; --s:0.9;  --r:0deg;"   alt="">
    </div>

</div>

<!-- game layout -->
<div id="game-layout">
    <!-- left settings -->
    <div id="left-panel">
        <h3>Settings</h3>
        <label>Level:</label>
        <div class = "option-group" id="level-group">
            <button class="option-btn" data-size="10" data-level="easy">Easy (10x10)</button>
            <button class="option-btn active" data-size="12" data-level="medium">Medium (12x12)</button>
            <button class="option-btn" data-size="15" data-level="hard">Hard (15x15)</button>
        </div>
        <label>Language:</label>
        <div class = "option-group" id="language-group">
            <button class="option-btn active" data-language="en">English</button>
            <button class="option-btn" data-language="es">Spanish</button>
            <button class="option-btn" data-language="de">German</button>
        </div>
    </div>


    <!-- center settings -->
    <div id="center-panel">
        <h1>AquaSearch</h1>
        <div id="grid"></div>
        <button id="new-game"> New Game (<span id="games-left">3</span>)</button>
        <p id="message"></p>
    </div>


    <!-- right settings -->
    <div id="right-panel">
        <h3>Words to Find</h3>
        <ul id="word-list"></ul>
    </div>

</div>

<!-- victory screen -->
<div id="victory" class="hidden">
    <div class="ocean-bubbles-layer"></div>
    <div class="ocean-creatures-layer">
        <img class="creature swim"  src="img/sea/fish1.svg"     style="--x:6%;  --y:20%; --s:1.0; --d:0s;   --t:16s;" alt="">
        <img class="creature swim"  src="img/sea/fish3.svg"     style="--x:74%; --y:12%; --s:0.9; --d:2s;   --t:19s;" alt="">
        <img class="creature swim"  src="img/sea/fish5.svg"     style="--x:28%; --y:64%; --s:1.2; --d:4s;   --t:17s;" alt="">
        <img class="creature swim"  src="img/sea/fish7.svg"     style="--x:86%; --y:52%; --s:1.0; --d:1s;   --t:21s;" alt="">
        <img class="creature swim"  src="img/sea/fish2.svg"     style="--x:48%; --y:78%; --s:0.8; --d:3s;   --t:23s;" alt="">
        <img class="creature big"   src="img/sea/shark.svg"     style="--x:52%; --y:32%; --s:1.7; --d:3s;   --t:28s;" alt="">
        <img class="creature big"   src="img/sea/octopus.svg"   style="--x:12%; --y:46%; --s:1.4; --d:5s;   --t:24s;" alt="">
        <img class="creature big"   src="img/sea/dolphin.svg"   style="--x:78%; --y:74%; --s:1.3; --d:2.5s; --t:26s;" alt="">
        <img class="creature big"   src="img/sea/whale.svg"     style="--x:36%; --y:8%;  --s:1.5; --d:6s;   --t:32s;" alt="">
        <img class="creature big"   src="img/sea/jellyfish.svg" style="--x:64%; --y:58%; --s:1.1; --d:1.5s; --t:20s;" alt="">
        <img class="creature still" src="img/sea/starfish.svg"  style="--x:8%;  --y:86%; --s:1.0; --d:0.5s;" alt="">
        <img class="creature still" src="img/sea/crab.svg"      style="--x:90%; --y:88%; --s:1.0; --d:1.2s;" alt="">
        <img class="creature still" src="img/sea/lobster.svg"   style="--x:70%; --y:92%; --s:0.9; --d:2s;"   alt="">
        <img class="creature still" src="img/sea/coral1.svg"    style="--x:2%;  --y:78%; --s:1.3; --d:0s;"   alt="">
        <img class="creature still" src="img/sea/coral3.svg"    style="--x:20%; --y:90%; --s:1.1; --d:0.8s;" alt="">
        <img class="creature still" src="img/sea/coral5.svg"    style="--x:52%; --y:94%; --s:1.2; --d:1.6s;" alt="">
        <img class="creature still" src="img/sea/coral2.svg"    style="--x:82%; --y:80%; --s:1.0; --d:2.4s;" alt="">
    </div>

    <div id="confetti"></div>

    <div id="victory-content">
        <h2>🏆 Congratulations! 🏆</h2>
        <p>You saved the ocean!</p>
        <button id="victory-button">Play Again</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
